name: Sync Fork with Upstream

on:
  schedule:
    - cron: '*/30 * * * *' # Automatically checks and syncs every 30 minutes
  workflow_dispatch: # Allows manual sync from the Actions tab anytime

permissions:
  contents: write

jobs:
  sync-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/VeerabhadraYerram/IITKgp_KVCache.git || git remote set-url upstream https://github.com/VeerabhadraYerram/IITKgp_KVCache.git
          git fetch upstream main
          git checkout main
          git merge upstream/main --ff-only || git merge upstream/main -m "chore: sync upstream changes"
          git push origin main
